services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: shipper
      POSTGRES_PASSWORD: shipper
      POSTGRES_DB: shipper_chatbot
    ports:
      - "5433:5432"
    volumes:
      - shipper_chatbot_pgdata:/var/lib/postgresql/data

volumes:
  shipper_chatbot_pgdata:
